site_name: ExpositoTOP — Portal técnico
site_description: RTVRPTW, Recomendador Turístico con Ventanas de Tiempo (TOPTW + GRASP). Documentación Docs-as-Code.
site_author: Andreaavr
site_url: https://andreaavr.github.io/ExpositoTOP/
repo_url: https://github.com/Andreaavr/ExpositoTOP
repo_name: ExpositoTOP
edit_uri: edit/main/docs/
copyright: Universidad de La Laguna · Laboratorio de Desarrollo y Herramientas

theme:
  name: material
  language: es
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang: es
  # Referencia del código generada con Doxygen e integrada como páginas Markdown.
  - mkdoxy:
      projects:
        api:
          src-dirs: src/main/java
          full-doc: True
          doxy-cfg:
            FILE_PATTERNS: "*.java"
            RECURSIVE: True
            OPTIMIZE_OUTPUT_JAVA: True
            JAVADOC_AUTOBRIEF: True
            EXTRACT_ALL: True
            EXTRACT_PRIVATE: True
            EXTRACT_PACKAGE: True
            HAVE_DOT: True
            CLASS_GRAPH: True
            COLLABORATION_GRAPH: True
            UML_LOOK: True
      save-api: .mkdoxy

nav:
  - Inicio: index.md
  - Manual de uso:
      - Guía de usuario: guia-usuario.md
      - Formato de las instancias: formato-instancias.md
      - Preguntas frecuentes: faq.md
  - Diseño:
      - Arquitectura: arquitectura.md
      - Algoritmo GRASP: algoritmo.md
  - Maven:
      - Maven y su ciclo de vida: maven/index.md
      - Órdenes y uso desde el IDE: maven/ordenes.md
      - Plugins configurados: maven/plugins.md
  - Calidad:
      - Análisis con SonarQube: calidad/sonarqube.md
      - Incidencias y soluciones: calidad/incidencias.md
      - Pruebas: calidad/pruebas.md
  - Documentación:
      - Doxygen y MkDocs: documentacion/docs-as-code.md
  - Decisiones (ADR):
      - adr/index.md
      - 0001 Migración a Maven: adr/0001-migracion-a-maven.md
      - 0002 Ventana temporal desde los últimos campos: adr/0002-ventana-temporal-ultimos-campos.md
      - 0003 Aleatoriedad inyectable: adr/0003-aleatoriedad-inyectable.md
      - 0004 Salida desacoplada de la consola: adr/0004-salida-desacoplada.md
      - 0005 Estrategia de selección como enum: adr/0005-estrategia-seleccion-enum.md
      - 0006 Docs-as-Code con Doxygen + MkDocs: adr/0006-docs-as-code.md
  - Referencia API:
      - api-referencia.md
      - Clases: api/annotated.md
      - Jerarquía: api/hierarchy.md
      - Miembros: api/class_members.md
      - Paquetes: api/namespaces.md
      - Ficheros: api/files.md
  - Cambios: changelog.md
