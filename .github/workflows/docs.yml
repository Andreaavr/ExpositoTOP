name: Documentación

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Doxygen, Graphviz y LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends doxygen graphviz \
            texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended \
            texlive-lang-spanish texlive-font-utils ghostscript make

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar MkDocs, MkDoxy y Playwright
        run: |
          pip install -r requirements-docs.txt
          python -m playwright install --with-deps chromium

      - name: Doxygen (HTML, XML y LaTeX) y refman.pdf
        run: |
          doxygen Doxyfile
          make -C target/doxygen/latex
          cat target/doxygen/warnings.log || true

      - name: Portal MkDocs
        run: mkdocs build

      - name: PDF del portal
        run: python scripts/build_pdf.py --site site --out site/pdf/ExpositoTOP-documentacion.pdf

      - name: Integrar HTML de Doxygen y PDFs en el portal
        run: |
          mkdir -p site/doxygen site/pdf
          cp -r target/doxygen/html/* site/doxygen/
          cp target/doxygen/latex/refman.pdf site/pdf/ExpositoTOP-referencia-doxygen.pdf

      - uses: actions/upload-artifact@v4
        with:
          name: documentacion-pdf
          path: site/pdf/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
